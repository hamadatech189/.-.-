<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- إعدادات SEO للنشر على الإنترنت -->
    <title>مؤقت الإنجاز | Focus Pro</title>
    <meta name="description" content="تطبيق احترافي لتنظيم وقت المذاكرة بتقنية بومودورو، يحتوي على مهام، إشعارات، وإحصائيات لدعم طلاب الثانوية.">
    <meta name="keywords" content="مؤقت, مذاكرة, بومودورو, ثانوية عامة, تركيز, إنتاجية, حماده عبدالفتاح">
    <meta name="author" content="Hamada Abdelfattah">
    <!-- إعدادات المشاركة على السوشيال ميديا (Open Graph) -->
    <meta property="og:title" content="مؤقت الإنجاز | Focus Pro">
    <meta property="og:description" content="نظم وقتك وضاعف إنتاجيتك مع هذا التطبيق الاحترافي.">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --accent-color: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.4);
            --danger-color: #ff4757;
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --circle-bg: rgba(255, 255, 255, 0.05);
            --card-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            --task-bg: rgba(0, 0, 0, 0.2);
        }

        body.light-theme {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-color: #1e272e;
            --accent-color: #0984e3;
            --accent-glow: rgba(9, 132, 227, 0.4);
            --danger-color: #d63031;
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --circle-bg: rgba(0, 0, 0, 0.05);
            --card-shadow: 0 15px 35px rgba(31, 38, 135, 0.15);
            --task-bg: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            padding: 40px 15px; color: var(--text-color);
            transition: background 0.5s ease;
        }

        .glass-container {
            background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 30px;
            padding: 35px 30px; width: 100%; max-width: 500px;
            box-shadow: var(--card-shadow); display: flex; flex-direction: column; align-items: center;
        }

        /* Top Navbar */
        .navbar {
            width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
        }
        .time-badge { background: var(--task-bg); padding: 8px 15px; border-radius: 20px; font-weight: 700; letter-spacing: 1px; }
        .nav-controls button {
            background: none; border: none; color: var(--text-color); font-size: 1.4rem; cursor: pointer;
            margin-right: 12px; transition: transform 0.3s, text-shadow 0.3s;
        }
        .nav-controls button:hover { transform: scale(1.15); text-shadow: 0 0 10px var(--accent-glow); }

        /* Timer Section */
        .status-badge {
            background: var(--accent-color); color: #fff; padding: 5px 20px; border-radius: 20px;
            font-size: 0.9rem; font-weight: bold; margin-bottom: 20px; box-shadow: 0 0 15px var(--accent-glow);
        }
        
        .timer-container { position: relative; width: 280px; height: 280px; margin-bottom: 30px; }
        .timer-circle { transform: rotate(-90deg); width: 100%; height: 100%; filter: drop-shadow(0 0 10px var(--accent-glow)); }
        .timer-circle circle { fill: none; stroke-width: 7; stroke-linecap: round; }
        .timer-circle .bg { stroke: var(--circle-bg); }
        .timer-circle .progress {
            stroke: var(--accent-color); stroke-dasharray: 816; stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.5s;
        }
        .timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; }
        .timer-text h2 { font-size: 5rem; font-weight: 800; letter-spacing: 2px; line-height: 1; }
        .timer-text p { font-size: 1.1rem; font-weight: 500; opacity: 0.8; margin-top: 5px; }

        /* Main Controls */
        .controls { display: flex; gap: 20px; margin-bottom: 35px; }
        .control-btn {
            width: 70px; height: 70px; border-radius: 50%; background: var(--glass-bg); color: var(--text-color);
            font-size: 1.8rem; cursor: pointer; border: 1px solid var(--glass-border);
            transition: all 0.3s ease; display: flex; justify-content: center; align-items: center;
        }
        .control-btn:hover { background: var(--accent-color); color: #fff; transform: translateY(-5px); box-shadow: 0 10px 20px var(--accent-glow); border-color: var(--accent-color); }
        #playBtn.playing { background: var(--danger-color); color: white; border-color: var(--danger-color); box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4); }

        /* Tasks */
        .tasks-section { width: 100%; margin-bottom: 25px; border-top: 1px solid var(--glass-border); padding-top: 25px; }
        .tasks-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .tasks-title { font-size: 1.1rem; opacity: 0.9; }
        .clear-btn { background: none; border: none; color: var(--text-color); opacity: 0.6; cursor: pointer; font-size: 0.9rem; text-decoration: underline; transition: 0.3s; }
        .clear-btn:hover { opacity: 1; color: var(--danger-color); }
        
        .task-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .task-input-group input { flex: 1; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--task-bg); color: var(--text-color); outline: none; }
        .task-input-group button { background: var(--accent-color); color: #fff; border: none; width: 45px; border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 1.2rem; }
        .task-input-group button:hover { transform: scale(1.05); }
        
        .task-list { list-style: none; max-height: 150px; overflow-y: auto; padding-right: 5px; }
        .task-list::-webkit-scrollbar { width: 6px; }
        .task-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        .task-item { background: var(--task-bg); padding: 12px 15px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; border: 1px solid transparent; }
        .task-item:hover { border-color: var(--glass-border); }
        .task-item.completed span { text-decoration: line-through; opacity: 0.5; }
        .task-item button { background: none; border: none; color: var(--danger-color); cursor: pointer; opacity: 0.7; }
        .task-item button:hover { opacity: 1; }
        .task-content { display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; }
        .checkbox { width: 20px; height: 20px; border: 2px solid var(--text-color); border-radius: 5px; display: inline-block; transition: 0.2s; }
        .task-item.completed .checkbox { background: var(--accent-color); border-color: var(--accent-color); }

        /* Stats & Signature */
        .footer-stats { width: 100%; text-align: center; border-top: 1px solid var(--glass-border); padding-top: 20px; }
        .sessions-count { font-size: 1.1rem; font-weight: 700; display: flex; justify-content: center; gap: 15px; }
        .sessions-count div i { color: #f1c40f; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        
        .creator-signature { font-family: 'Aref Ruqaa', serif; font-size: 1.8rem; margin-top: 25px; color: var(--text-color); opacity: 0.9; text-shadow: 2px 2px 4px rgba(0,0,0,0.4); text-align: center; transition: 0.3s; }
        .creator-signature:hover { opacity: 1; transform: scale(1.05); color: var(--accent-color); }
        body.light-theme .creator-signature { text-shadow: 2px 2px 4px rgba(255,255,255,0.6); }

        /* Settings Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; color: var(--text-color); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.3rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
        .close-modal { background: none; border: none; color: var(--text-color); font-size: 1.5rem; cursor: pointer; }
        .setting-group { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .setting-group input { width: 70px; padding: 8px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--task-bg); color: var(--text-color); outline: none; text-align: center; font-weight: bold; }
        .save-settings { width: 100%; padding: 12px; background: var(--accent-color); color: #fff; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .save-settings:hover { box-shadow: 0 0 15px var(--accent-glow); }

        @media (max-width: 480px) {
            .glass-container { padding: 25px 20px; }
            .timer-container { width: 230px; height: 230px; }
            .timer-text h2 { font-size: 4rem; }
            .timer-circle .progress { stroke-dasharray: 660; }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <!-- Top Navbar -->
        <div class="navbar">
            <div class="time-badge" id="currentTime">00:00</div>
            <div class="nav-controls">
                <button id="fullscreenBtn" title="ملء الشاشة"><i class="fa-solid fa-expand"></i></button>
                <button id="settingsBtn" title="الإعدادات"><i class="fa-solid fa-gear"></i></button>
                <button id="muteBtn" title="الصوت"><i class="fa-solid fa-volume-high"></i></button>
                <button id="themeBtn" title="المظهر"><i class="fa-solid fa-moon"></i></button>
            </div>
        </div>

        <div class="status-badge" id="modeBadge">وقت المذاكرة</div>

        <!-- Timer -->
        <div class="timer-container">
            <svg class="timer-circle" viewBox="0 0 280 280" id="svgCircle">
                <circle class="bg" cx="140" cy="140" r="130"></circle>
                <circle class="progress" id="circleProgress" cx="140" cy="140" r="130"></circle>
            </svg>
            <div class="timer-text">
                <h2 id="timeDisplay">25:00</h2>
                <p id="statusText">جاهز للبدء؟</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="control-btn" id="playBtn"><i class="fa-solid fa-play"></i></button>
            <button class="control-btn" id="skipBtn" title="تخطي"><i class="fa-solid fa-forward-step"></i></button>
            <button class="control-btn" id="resetBtn" title="إعادة ضبط"><i class="fa-solid fa-rotate-right"></i></button>
        </div>

        <!-- Tasks -->
        <div class="tasks-section">
            <div class="tasks-header">
                <h3 class="tasks-title"><i class="fa-solid fa-list-check"></i> مهام اليوم</h3>
                <button class="clear-btn" onclick="clearCompleted()">حذف المكتمل</button>
            </div>
            <div class="task-input-group">
                <input type="text" id="taskInput" placeholder="ماذا ستنجز في هذه الجلسة؟" onkeypress="if(event.key === 'Enter') addTask()">
                <button onclick="addTask()"><i class="fa-solid fa-plus"></i></button>
            </div>
            <ul id="taskList" class="task-list"></ul>
        </div>

        <!-- Stats -->
        <div class="footer-stats">
            <div class="sessions-count">
                <div><i class="fa-solid fa-fire"></i> الجلسات: <span id="sessionCount">0</span></div>
                <div><i class="fa-solid fa-rotate"></i> الدورة: <span id="cycleCount">1</span>/4</div>
            </div>
        </div>

        <!-- Signature -->
        <div class="creator-signature">من إنشاء حماده عبدالفتاح 
            ٠١٠١١٤٣٩٨٤١ </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <span><i class="fa-solid fa-sliders"></i> الإعدادات</span>
                <button class="close-modal" id="closeSettings"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="setting-group">
                <label>مدة المذاكرة (دقائق)</label>
                <input type="number" id="studyTimeInput" min="1" max="120" value="25">
            </div>
            <div class="setting-group">
                <label>راحة قصيرة (دقائق)</label>
                <input type="number" id="shortBreakInput" min="1" max="30" value="5">
            </div>
            <div class="setting-group">
                <label>راحة طويلة (دقائق)</label>
                <input type="number" id="longBreakInput" min="5" max="60" value="15">
            </div>
            <button class="save-settings" id="saveSettingsBtn">حفظ التعديلات</button>
        </div>
    </div>

    <script>
        // --- State Variables ---
        let config = JSON.parse(localStorage.getItem('focus_config')) || { study: 25, shortBreak: 5, longBreak: 15 };
        let timerId = null;
        let timeLeft = config.study * 60;
        let totalTime = config.study * 60;
        let currentMode = 'study'; // study, shortBreak, longBreak
        let isRunning = false;
        let isMuted = false;
        
        let sessionsCompleted = parseInt(localStorage.getItem('focus_sessions')) || 0;
        let cycle = (sessionsCompleted % 4) + 1; // 4 sessions = 1 cycle

        // --- DOM Elements ---
        const timeDisplay = document.getElementById('timeDisplay');
        const statusText = document.getElementById('statusText');
        const modeBadge = document.getElementById('modeBadge');
        const circleProgress = document.getElementById('circleProgress');
        const playBtn = document.getElementById('playBtn');
        const sessionCountEl = document.getElementById('sessionCount');
        const cycleCountEl = document.getElementById('cycleCount');

        // Circular Math
        function getCircleCircumference() {
            const r = window.innerWidth <= 480 ? 115 : 130;
            return 2 * Math.PI * r;
        }
        let circleCircumference = getCircleCircumference();
        circleProgress.style.strokeDasharray = circleCircumference;

        // --- Initialization ---
        function init() {
            updateStats();
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            updateDisplay();
            loadTasks();
            requestNotificationPermission();

            if(localStorage.getItem('focus_theme') === 'light') toggleTheme(true);
            
            window.addEventListener('resize', () => {
                circleCircumference = getCircleCircumference();
                circleProgress.style.strokeDasharray = circleCircumference;
                updateDisplay();
            });
        }

        // --- Notifications ---
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }
        function sendNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body, icon: "https://cdn-icons-png.flaticon.com/512/2941/2941584.png" });
            }
        }

        // --- Audio System ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'tick') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.05, now + 0.01); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'end') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.2);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.3, now + 0.1); gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
                osc.start(now); osc.stop(now + 1.5);
            }
        }

        // --- Timer Core ---
        function updateDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            timeDisplay.innerText = `${m}:${s}`;
            document.title = `${m}:${s} - Focus Pro`;
            
            const offset = circleCircumference - ((timeLeft / totalTime) * circleCircumference);
            circleProgress.style.strokeDashoffset = offset;

            let color = currentMode === 'study' ? 'var(--accent-color)' : (currentMode === 'shortBreak' ? '#f39c12' : '#9b59b6');
            let glow = currentMode === 'study' ? 'var(--accent-glow)' : (currentMode === 'shortBreak' ? 'rgba(243, 156, 18, 0.4)' : 'rgba(155, 89, 182, 0.4)');
            
            circleProgress.style.stroke = color;
            modeBadge.style.background = color;
            modeBadge.style.boxShadow = `0 0 15px ${glow}`;
            document.documentElement.style.setProperty('--accent-color', color);
            document.documentElement.style.setProperty('--accent-glow', glow);
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId); isRunning = false;
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; playBtn.classList.remove('playing');
                statusText.innerText = 'مؤقت..';
            } else {
                isRunning = true;
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>'; playBtn.classList.add('playing');
                statusText.innerText = currentMode === 'study' ? 'بطل يذاكر 🔥' : 'استرخِ قليلاً ☕';
                
                timerId = setInterval(() => {
                    timeLeft--;
                    if(timeLeft > 0 && timeLeft <= 3) playSound('tick'); 
                    updateDisplay();
                    if (timeLeft === 0) switchMode();
                }, 1000);
            }
        }

        function switchMode() {
            clearInterval(timerId); isRunning = false; playSound('end');
            playBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; playBtn.classList.remove('playing');

            if (currentMode === 'study') {
                sessionsCompleted++;
                localStorage.setItem('focus_sessions', sessionsCompleted);
                cycle = (sessionsCompleted % 4) + 1;
                
                if (cycle === 1) { // It means 4 sessions completed
                    setMode('longBreak');
                    sendNotification("راحة طويلة!", "عمل رائع! لقد أنهيت 4 جلسات، خذ راحة طويلة الآن.");
                } else {
                    setMode('shortBreak');
                    sendNotification("راحة قصيرة!", "ممتاز! خذ بضع دقائق للراحة.");
                }
            } else {
                setMode('study');
                sendNotification("وقت المذاكرة!", "انتهت الراحة، عد للتركيز لتحقيق حلمك.");
            }
            updateStats();
        }

        function setMode(mode) {
            currentMode = mode;
            if(mode === 'study') {
                timeLeft = totalTime = config.study * 60;
                modeBadge.innerText = "وقت المذاكرة 📚";
            } else if(mode === 'shortBreak') {
                timeLeft = totalTime = config.shortBreak * 60;
                modeBadge.innerText = "راحة قصيرة ☕";
            } else {
                timeLeft = totalTime = config.longBreak * 60;
                modeBadge.innerText = "راحة طويلة 🧘‍♂️";
            }
            statusText.innerText = "جاهز للبدء؟";
            updateDisplay();
        }

        function resetTimer() {
            clearInterval(timerId); isRunning = false;
            playBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; playBtn.classList.remove('playing');
            setMode(currentMode); // Reset current mode time
        }

        function updateStats() {
            sessionCountEl.innerText = sessionsCompleted;
            cycleCountEl.innerText = cycle;
        }

        // --- Tasks Logic ---
        let tasks = JSON.parse(localStorage.getItem('focus_tasks')) || [];
        function saveTasks() { localStorage.setItem('focus_tasks', JSON.stringify(tasks)); }
        
        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            tasks.forEach((task, i) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <div class="task-content" onclick="toggleTask(${i})">
                        <span class="checkbox"></span><span>${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${i})"><i class="fa-solid fa-trash-can"></i></button>`;
                list.appendChild(li);
            });
        }
        function addTask() {
            const inpt = document.getElementById('taskInput');
            if(inpt.value.trim()) { tasks.push({text: inpt.value.trim(), completed: false}); inpt.value = ''; saveTasks(); renderTasks(); }
        }
        function toggleTask(i) { tasks[i].completed = !tasks[i].completed; saveTasks(); renderTasks(); }
        function deleteTask(i) { tasks.splice(i, 1); saveTasks(); renderTasks(); }
        function clearCompleted() { tasks = tasks.filter(t => !t.completed); saveTasks(); renderTasks(); }
        function loadTasks() { renderTasks(); }

        // --- UI & Controls ---
        document.getElementById('playBtn').addEventListener('click', toggleTimer);
        document.getElementById('resetBtn').addEventListener('click', resetTimer);
        document.getElementById('skipBtn').addEventListener('click', switchMode);

        document.getElementById('muteBtn').addEventListener('click', (e) => {
            isMuted = !isMuted;
            e.currentTarget.innerHTML = isMuted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
            e.currentTarget.style.color = isMuted ? 'var(--danger-color)' : 'var(--text-color)';
        });

        function toggleTheme(forceLight = false) {
            const isLight = forceLight || !document.body.classList.contains('light-theme');
            document.body.classList.toggle('light-theme', isLight);
            localStorage.setItem('focus_theme', isLight ? 'light' : 'dark');
            document.getElementById('themeBtn').innerHTML = isLight ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }
        document.getElementById('themeBtn').addEventListener('click', () => toggleTheme());

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        });

        // --- Settings Modal ---
        const modal = document.getElementById('settingsModal');
        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('studyTimeInput').value = config.study;
            document.getElementById('shortBreakInput').value = config.shortBreak;
            document.getElementById('longBreakInput').value = config.longBreak;
            modal.classList.add('active');
        });
        document.getElementById('closeSettings').addEventListener('click', () => modal.classList.remove('active'));
        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            config.study = parseInt(document.getElementById('studyTimeInput').value) || 25;
            config.shortBreak = parseInt(document.getElementById('shortBreakInput').value) || 5;
            config.longBreak = parseInt(document.getElementById('longBreakInput').value) || 15;
            localStorage.setItem('focus_config', JSON.stringify(config));
            modal.classList.remove('active');
            setMode('study'); // Apply changes immediately
        });

        function updateCurrentTime() {
            const now = new Date(); let h = now.getHours(); let m = now.getMinutes(); let ampm = h >= 12 ? 'م' : 'ص';
            h = h % 12; h = h ? h : 12; m = m < 10 ? '0'+m : m;
            document.getElementById('currentTime').innerText = `${h}:${m} ${ampm}`;
        }

        init();
    </script>
</body>
</html>
